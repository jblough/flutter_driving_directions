name: flutter_driving_directions
description: A Flutter plugin to launch native driving directions on Android and iOS platforms.
version: 3.0.1
homepage: https://github.com/jblough/flutter_driving_directions

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.josephblough.flutter_driving_directions
        pluginClass: FlutterDrivingDirectionsPlugin
      ios:
        pluginClass: FlutterDrivingDirectionsPlugin
